name: arthatrack
description: "ArthaTrack - Production-ready, local-first personal finance tracker with BYOK AI & offline regex dual-engine parsing for India."
publish_to: "none"
version: 1.1.0+14

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Local Storage & Privacy-First SQLite
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # Keystore-backed Secret Storage for BYOK LLM Keys
  flutter_secure_storage: ^9.2.2

  # Google OAuth 2.0 & Gmail API Ingestion
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  http: ^1.2.2

  # Formatting & State Management
  intl: ^0.19.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.8

flutter:
  uses-material-design: true
