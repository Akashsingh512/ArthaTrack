name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          set +e
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation > build_log.txt 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== FLUTTER BUILD FAILED ==="
            tail -n 80 build_log.txt
          fi
          exit $EXIT_CODE

      - name: Report Failure Log
        if: failure()
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-failure-debug
          name: "Build Failure Log"
          body_path: build_log.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Named APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ArthaTrack-Beta-v1.1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arthatrack-release-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create or Update Beta Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.1.0-beta5
          name: "ArthaTrack Beta v1.1.0 (Build 5)"
          body: |
            ### 🚀 ArthaTrack Beta v1.1.0 (Build 5)
            
            #### 🌟 Highlights & Features Included:
            - **📑 Dual Export Options**: Choose between **Standard CSV Export** (clean financial ledger) and **Export with Raw SMS** (audit log with unparsed SMS messages) to inspect and verify how all messages are sorted.
            - **📂 Public Downloads Saving**: Both export types save directly to your phone's public `/storage/emulated/0/Download/` folder (`arthatrack_transactions.csv` & `arthatrack_transactions_with_sms.csv`) via Android MediaStore API.
            - **📋 1-Tap Copy All CSV**: Easily copy all CSV data (standard or with SMS text) to clipboard for instant sharing.
            - **Multi-Select Bulk Categorization**: Select multiple transactions and update categories simultaneously, or create new custom categories on-the-fly.
            - **AES-256 Encrypted Auto-Backup & Migration**: Zero-dependency Pure-Dart encrypted backups to Google Drive (`appDataFolder`) and WebDAV (Nextcloud/NAS) with PBKDF2/HMAC-SHA256 passphrase security.
            - **Subtle Micro-Haptic Feedback**: Centralized tactile response system across all buttons, chips, tabs, and bottom sheets.
            - **Motion & Animated Transition Curves**: Polished animated curves on category and filter chips.
            - **Indian Banking Engine V3.0 Edge Case Polish**: NACH/AutoPay pre-debit notice shield and accurate refund income tracking.

            #### 📲 Download & Install:
            Download **`ArthaTrack-Beta-v1.1.0.apk`** below to install directly on your Android phone!
            *(Application ID: `com.arthatrack.beta` — installs smoothly on your phone)*
          files: build/app/outputs/flutter-apk/ArthaTrack-Beta-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

