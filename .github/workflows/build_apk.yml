name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          set +e
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation > build_log.txt 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== FLUTTER BUILD FAILED ==="
            tail -n 80 build_log.txt
          fi
          exit $EXIT_CODE

      - name: Report Failure Log
        if: failure()
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-failure-debug
          name: "Build Failure Log"
          body_path: build_log.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Named APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ArthaTrack-Beta-v1.1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arthatrack-release-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create or Update Beta Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.1.0-beta7
          name: "ArthaTrack Beta v1.1.0 (Build 7)"
          body: |
            ### 🚀 ArthaTrack Beta v1.1.0 (Build 7)
            
            #### 🌟 Highlights & What's New in Build 7:
            - **📅 Date-Range & Month-Based SMS Transaction Pulling**:
              - You can now pull transactions directly by date window: **This Month**, **This Week Only**, **Last Month**, **Last 3 Months**, **This Year (2026)**, **All Time**, or any **Custom Range (e.g. Sept to Nov)** with start and end date pickers!
              - Native Android Telephony SQL filtering (`date >= ? AND date <= ?`) filters messages directly at the Android SQLite layer for near-instant scanning.
              - Visual explanation card in the SMS Sync Sheet dynamically displays the exact date range being scanned.
              - Set your preferred date period as your permanent default in Settings.
            - **🛡️ Fixed SMS Concurrency Error (`A sync is already in progress`)**:
              - Completely resolved the red snackbar error caused by concurrent background/pull-to-refresh checks and manual user taps. Background and foreground syncs are now gracefully coalesced with platform timeouts.
            - **☀️ Light Mode UI Bug Fixes in Settings**:
              - **Fixed Dropdown Text Contrast**: Dropdown menu background and text now dynamically adapt to light and dark themes with full readability.
              - **Fixed "Test Key" Button**: Border and label colors now display crisp dark slate text on light mode instead of blending into white.
              - **SMS Section Theming**: All cards and borders in Settings now utilize theme-aware adaptive surfaces.
            - **📊 Dedicated Analytics & Insights Tab**: Donut charts, spending bars, cash flow, merchant leaderboard, and payment mode breakdown.
            - **🛍️ Intelligent Merchant & Shop Category Finder**: Accurate category classification for shops and merchants (e.g. `biteandbrew` -> Food, `zudio` -> Shopping).
            - **📳 Crisp Micro-Haptics & Dual CSV Export**: Native physical haptics and dual CSV export (normal & with raw SMS) directly to `/storage/emulated/0/Download/`.

            #### 📲 Download & Install:
            Download **`ArthaTrack-Beta-v1.1.0.apk`** below to install directly on your Android phone!
            *(Application ID: `com.arthatrack.beta` — updates smoothly over Build 6)*
          files: build/app/outputs/flutter-apk/ArthaTrack-Beta-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

