name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          set +e
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation > build_log.txt 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== FLUTTER BUILD FAILED ==="
            tail -n 80 build_log.txt
          fi
          exit $EXIT_CODE

      - name: Report Failure Log
        if: failure()
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-failure-debug
          name: "Build Failure Log"
          body_path: build_log.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Named APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ArthaTrack-Beta-v1.1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arthatrack-release-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create or Update Beta Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.1.0-beta17
          name: "ArthaTrack Beta v1.1.0 (Build 17)"
          body: |
            ### 🚀 ArthaTrack Beta v1.1.0 (Build 17)
            
            #### 🌟 Highlights & What's New in Build 17:
            - **💱 Foreign Currency & USD Auto-Conversion**:
              - Automatically detects transactions denominated in foreign currencies (USD, EUR, GBP) and converts them to INR (₹) at standard rates while preserving original forex metadata.
            - **🛡️ Balance Isolation & Restriction Guards**:
              - Strict balance isolation ensures "available balance" or "current balance" never leaks into transaction amounts (e.g. "spent 2.50 USD available amount is 200000").
              - Pure balance inquiry notifications are automatically blocked from being recorded as transactions.
            - **💾 Zero-Loss SQLite Notification Journal**:
              - Native Kotlin SQLite write-ahead log (`NotificationDbHelper.kt`) guarantees At-Least-Once Delivery for ephemeral UPI push notifications (GPay, PhonePe, Paytm, CRED).
              - Incoming transactions are safely persisted to disk even if the app UI or Flutter engine is closed or sleeping.
            - **⚡ Permissions & Battery Saver Optimization Flow**:
              - Startup bottom sheet modal automatically prompts for all essential tracking permissions (Bank SMS, Notification Access, Battery Saver Exemption).
              - Dedicated guidance for OEM-specific "Special SMS Permission" (Xiaomi MIUI/HyperOS, Vivo, Oppo, Android 13+ restricted settings).
              - First-class "Background & Battery Saver" card in Settings with live real-time status auto-refresh and direct exemption trigger (`REQUEST_IGNORE_BATTERY_OPTIMIZATIONS`).
            - **🔒 Auto-Rebind & Defensive Reliability**:
              - Self-healing notification binder re-connection on disconnect and app resume.
              - Multi-tier fallback intents to prevent any system crashes on customized OEM ROMs.
            
            #### 📲 Download & Install:
            Download **`ArthaTrack-Beta-v1.1.0.apk`** below to install directly on your Android phone!
            *(Application ID: `com.arthatrack.beta` — updates smoothly over previous builds)*
          files: build/app/outputs/flutter-apk/ArthaTrack-Beta-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

