name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          set +e
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation > build_log.txt 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== FLUTTER BUILD FAILED ==="
            tail -n 80 build_log.txt
          fi
          exit $EXIT_CODE

      - name: Report Failure Log
        if: failure()
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-failure-debug
          name: "Build Failure Log"
          body_path: build_log.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Named APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ArthaTrack-Beta-v1.1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arthatrack-release-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create or Update Beta Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.1.0-beta11
          name: "ArthaTrack Beta v1.1.0 (Build 11)"
          body: |
            ### 🚀 ArthaTrack Beta v1.1.0 (Build 11)
            
            #### 🌟 Highlights & What's New in Build 11:
            - **🔓 100% Uncapped All-Time SMS Historical Sync**:
              - Completely removed any remaining message limits or query caps.
              - Selecting **All Time** now queries your entire phone SMS history without restriction, importing all historical transactions across every month and year.
            - **🛡️ Android OEM Query Resilience (Samsung / Xiaomi / Vivo / Oppo / Pixel)**:
              - Eliminated SQL `LIMIT` keyword inside `sortOrder` to prevent Android `SQLiteQueryBuilder` crashes on modern OEM ROMs.
              - Added secondary fallback to `content://sms` (`type = 1`) if `content://sms/inbox` is restricted or empty.
            - **⏱️ Extended Channel Timeout**:
              - MethodChannel IPC timeout increased to 3 minutes, reliably handling inboxes with tens of thousands of messages without timing out.
            - **⚡ Fixed In-App Updater & Browser Fallback**:
              - In-app update downloads stream directly via native `HttpClient` with zero connection leaks, plus a 1-tap Chrome/browser download fallback.
            
            #### 📲 Download & Install:
            Download **`ArthaTrack-Beta-v1.1.0.apk`** below to install directly on your Android phone!
            *(Application ID: `com.arthatrack.beta` — updates smoothly over previous builds)*
          files: build/app/outputs/flutter-apk/ArthaTrack-Beta-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

