name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          set +e
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation > build_log.txt 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== FLUTTER BUILD FAILED ==="
            tail -n 80 build_log.txt
          fi
          exit $EXIT_CODE

      - name: Report Failure Log
        if: failure()
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-failure-debug
          name: "Build Failure Log"
          body_path: build_log.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Named APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ArthaTrack-Beta-v1.1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arthatrack-release-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create or Update Beta Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.1.0-beta16
          name: "ArthaTrack Beta v1.1.0 (Build 16)"
          body: |
            ### 🚀 ArthaTrack Beta v1.1.0 (Build 16)
            
            #### 🌟 Highlights & What's New in Build 16:
            - **🛡️ Permanent Transaction Deletion Blacklist**:
              - When you delete any transaction, its SMS fingerprint, reference number, and merchant/amount are permanently blacklisted in SQLite.
              - Background SMS auto-sync and manual sync will **NEVER** re-import transactions you have deliberately deleted!
            - **🔕 Notification Loop & Spam Elimination**:
              - Completely resolved repeated buzzing / notifications ("again and again").
              - Self-originating recursion shield: ArthaTrack now strictly ignores its own alerts in the Android notification listener.
              - Excluded non-financial social/chat apps (WhatsApp, Telegram, etc.) from the notification listener and fixed substring keyword matching (`rs` regex boundary).
            - **🤫 100% Silent Background Auto-Sync**:
              - Automatic SMS detection on app launch and resume now runs completely silently in the background without posting noisy status-bar notifications.
              - Dedicated low-importance notification channel for manual sync operations with instant auto-dismissal on completion.
            
            #### 📲 Download & Install:
            Download **`ArthaTrack-Beta-v1.1.0.apk`** below to install directly on your Android phone!
            *(Application ID: `com.arthatrack.beta` — updates smoothly over previous builds)*
          files: build/app/outputs/flutter-apk/ArthaTrack-Beta-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

