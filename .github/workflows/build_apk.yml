name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          set +e
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation > build_log.txt 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== FLUTTER BUILD FAILED ==="
            tail -n 80 build_log.txt
          fi
          exit $EXIT_CODE

      - name: Report Failure Log
        if: failure()
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-failure-debug
          name: "Build Failure Log"
          body_path: build_log.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Named APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ArthaTrack-Beta-v1.1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arthatrack-release-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create or Update Beta Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.1.0-beta6
          name: "ArthaTrack Beta v1.1.0 (Build 6)"
          body: |
            ### 🚀 ArthaTrack Beta v1.1.0 (Build 6)
            
            #### 🌟 Highlights & New Features:
            - **⚡ User-Configurable SMS Transaction Pull Limit**: You can now decide exactly how many transactions/messages to pull and scan from your SMS inbox! Choose between quick presets (**50**, **100**, **250**, **500 (Recommended)**, **1,000**, **5,000**, **All / Deep Scan**) or enter any **Custom Number** (e.g. 150, 300, 750). Includes a "Remember as default limit" option in both the Sync Sheet and Settings.
            - **📊 Dedicated Analytics & Insights Tab**: Complete interactive visual breakdown with:
              - **Interactive Category Donut Chart** with percentage breakdowns and tap-to-inspect.
              - **Daily Spending Bar Chart** with peak-day highlighting.
              - **Cash Flow & Savings Rate Card** comparing income, expense, and net savings.
              - **Top Merchants Leaderboard** showing where your money goes.
              - **Payment Mode Breakdown** (UPI vs Cards vs NetBanking vs Cash).
            - **🛍️ Intelligent Merchant & Shop Category Finder**: Automatic, accurate category classification for brands and stores (e.g. `biteandbrew` -> Food, `zudio` -> Shopping, hypermarkets, cafes, bakeries, travel, and more).
            - **📳 Fixed Micro-Haptic Feedback**: Added native Android `VIBRATE` permission and native `Vibrator` / `VibratorManager` bridge for crisp, realistic physical haptic feedback across all taps, chips, and actions.
            - **📑 Dual CSV Export Options**: Choose between **Standard CSV Export** and **Export with Raw SMS** saved directly to public `/storage/emulated/0/Download/`.
            - **Multi-Select Bulk Categorization**: Select multiple transactions and update categories simultaneously.
            - **AES-256 Encrypted Auto-Backup**: Zero-dependency backups to Google Drive and WebDAV.

            #### 📲 Download & Install:
            Download **`ArthaTrack-Beta-v1.1.0.apk`** below to install directly on your Android phone!
            *(Application ID: `com.arthatrack.beta` — installs smoothly on your phone)*
          files: build/app/outputs/flutter-apk/ArthaTrack-Beta-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

