name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          set +e
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation > build_log.txt 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== FLUTTER BUILD FAILED ==="
            tail -n 80 build_log.txt
          fi
          exit $EXIT_CODE

      - name: Report Failure Log
        if: failure()
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-failure-debug
          name: "Build Failure Log"
          body_path: build_log.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Named APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ArthaTrack-Beta-v1.1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arthatrack-release-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create or Update Beta Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.1.0-beta15
          name: "ArthaTrack Beta v1.1.0 (Build 15)"
          body: |
            ### 🚀 ArthaTrack Beta v1.1.0 (Build 15)
            
            #### 🌟 Highlights & What's New in Build 15:
            - **💰 Accurate "Received" Summary & Income Total Calculation**:
              - Fixed the "Received" summary banner at the top of the Transactions screen to accurately reflect and sum all income & credit transactions in the filtered view.
            - **👔 Smart Salary & Corporate Payroll Classification**:
              - Corporate payroll and salary SMS messages (e.g. Axis Bank `IFT/CDP/.../UNIHEIG`) are now automatically recognized and categorized as **Salary** with the employer name (`UNIHEIG (Salary)`).
              - Existing misclassified salary entries are automatically healed on launch.
            - **🔄 Rate-Limit Proof In-App Updates**:
              - Added dual-fallback engine using `/releases/latest` redirect and Atom RSS feed, completely bypassing GitHub's 60 req/hr API rate limits on mobile carrier networks (CGNAT).
            - **📅 Precise SMS Date Range Filtering** (Build 14):
              - Syncing "This Year" or specific months now only reads the selected timeframe instead of scanning your whole inbox.
            - **🗑️ Swipe-to-Delete Confirmation Modal** (Build 14):
              - Accidental swipes no longer delete immediately; a safety dialog confirms deletion with full details.
            
            #### 📲 Download & Install:
            Download **`ArthaTrack-Beta-v1.1.0.apk`** below to install directly on your Android phone!
            *(Application ID: `com.arthatrack.beta` — updates smoothly over previous builds)*
          files: build/app/outputs/flutter-apk/ArthaTrack-Beta-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

