name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          set +e
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation > build_log.txt 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== FLUTTER BUILD FAILED ==="
            tail -n 80 build_log.txt
          fi
          exit $EXIT_CODE

      - name: Report Failure Log
        if: failure()
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-failure-debug
          name: "Build Failure Log"
          body_path: build_log.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Named APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ArthaTrack-Beta-v1.1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arthatrack-release-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create or Update Beta Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.1.0-beta8
          name: "ArthaTrack Beta v1.1.0 (Build 8)"
          body: |
            ### 🚀 ArthaTrack Beta v1.1.0 (Build 8)
            
            #### 🌟 Highlights & What's New in Build 8:
            - **🔄 In-App Direct GitHub Auto-Updater**:
              - You no longer have to visit GitHub releases in a browser to update ArthaTrack!
              - The app now checks for updates directly from GitHub on launch and via the new **"App Version & Updates"** section in **Settings**.
              - Download updates directly inside the app with a smooth streaming progress bar and install in 1 tap via Android's native system package installer.
            - **📊 Real-Time Live Progressive Sync Bar**:
              - Watch the live progress of your SMS scan: displays exact percentage (`Scanning: 68%`), live message counter (`340 / 500 msgs`), and real-time transaction count (`42 transactions detected so far`) in both the Sync Sheet and Settings.
            - **🛡️ Security Hardening & Vulnerability Remediation**:
              - **SMS Spoofing Guard**: Secured `SmsReceiver` with `android.permission.BROADCAST_SMS` so only the Android OS Telephony provider can deliver SMS broadcasts to ArthaTrack.
              - **ADB Backup Protection**: Added `android:allowBackup="false"` to prevent unauthorized USB ADB extraction of the SQLite database.
            - **📅 Date-Range & Month-Based SMS Pulling**:
              - Pull transactions by exact calendar periods: **This Month**, **This Week Only**, **Last Month**, **Last 3 Months**, **This Year (2026)**, **All Time**, or any **Custom Date Range (e.g. Sept to Nov)**.
              - Native Android Telephony SQL filtering (`date >= ? AND date <= ?`) filters messages directly in SQLite for instant scanning.
            - **☀️ Light Mode UI Bug Fixes in Settings**:
              - Fixed dropdown text contrast and "Test Key" button styling for crisp readability in light theme.
            - **📊 Dedicated Analytics & Insights Tab**:
              - Donut charts, spending bars, cash flow, merchant leaderboard, and payment mode breakdowns.

            #### 📲 Download & Install:
            Download **`ArthaTrack-Beta-v1.1.0.apk`** below to install directly on your Android phone!
            *(Application ID: `com.arthatrack.beta` — updates smoothly over previous builds)*
          files: build/app/outputs/flutter-apk/ArthaTrack-Beta-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

