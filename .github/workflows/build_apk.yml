name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          set +e
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation > build_log.txt 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== FLUTTER BUILD FAILED ==="
            tail -n 80 build_log.txt
          fi
          exit $EXIT_CODE

      - name: Report Failure Log
        if: failure()
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-failure-debug
          name: "Build Failure Log"
          body_path: build_log.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Named APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ArthaTrack-Beta-v1.1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arthatrack-release-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create or Update Beta Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.1.0-beta13
          name: "ArthaTrack Beta v1.1.0 (Build 13)"
          body: |
            ### 🚀 ArthaTrack Beta v1.1.0 (Build 13)
            
            #### 🌟 Highlights & What's New in Build 13:
            - **🔄 Background SMS Sync & Instant Resume**:
              - Added ongoing system notification with live progress bar so Android does not kill or freeze sync when the app is minimized or backgrounded.
              - In-memory fast-forwarding resumes interrupted syncs instantly (<0.001 ms per message) without re-parsing from scratch.
            - **🛡️ Duplicate Transactions Elimination**:
              - Mutual Fund / SIP Mandate Deduplication: Eliminates duplicate Axis Bank ACH vs. NACH debits appearing for the same mandate.
              - Auto-heals reference numbers from raw SMS (including UPI P2A/P2M and UMRN mandates).
              - Automatic database cleanup purges legacy duplicate mandate entries on launch.
              - Self-transfers between own accounts are properly excluded from income and expense aggregate calculations.
            - **🎨 Dialog Theme & Contrast Polish**:
              - Fixed "Set Balance" and "Edit Account" dialogs in Light Theme so text is crisp and clear against themed surface backgrounds.
            
            #### 📲 Download & Install:
            Download **`ArthaTrack-Beta-v1.1.0.apk`** below to install directly on your Android phone!
            *(Application ID: `com.arthatrack.beta` — updates smoothly over previous builds)*
          files: build/app/outputs/flutter-apk/ArthaTrack-Beta-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

