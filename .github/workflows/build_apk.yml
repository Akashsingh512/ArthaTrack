name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          set +e
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation > build_log.txt 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== FLUTTER BUILD FAILED ==="
            tail -n 80 build_log.txt
          fi
          exit $EXIT_CODE

      - name: Report Failure Log
        if: failure()
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-failure-debug
          name: "Build Failure Log"
          body_path: build_log.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Named APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ArthaTrack-Beta-v1.1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arthatrack-release-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create or Update Beta Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.1.0-beta9
          name: "ArthaTrack Beta v1.1.0 (Build 9)"
          body: |
            ### 🚀 ArthaTrack Beta v1.1.0 (Build 9)
            
            #### 🌟 Highlights & What's New in Build 9:
            - **🔓 Removed Artificial Message Caps & Enabled 50,000 Full Inbox Scan**:
              - Completely eliminated the restrictive message cap selector (250, 500, 1000) that prematurely truncated date-based message scans.
              - Date-based scans (**This Month**, **Last Month**, **Last 3 Months**, **This Year**, **Sept to Nov**, or **All Time**) now scan **100% of messages** in that time window (up to 50,000 messages) with zero artificial cutoffs.
            - **🛡️ Resilient Android Telephony Query Engine**:
              - Hardened `MainActivity.kt` with OEM-agnostic fallback query execution to guarantee flawless retrieval across Samsung, Xiaomi, Oppo, Vivo, OnePlus, and Google Pixel devices.
              - Full type-safety for millisecond epoch timestamps and safe limit clamping.
            - **🎯 Automatic Month-View Alignment on Import**:
              - When syncing a specific period (e.g. *Last Month* or a custom date range), the app automatically shifts your active transaction view to that month so newly imported transactions appear on screen immediately!
            - **🔄 In-App Direct GitHub Auto-Updater**:
              - Download and update ArthaTrack directly inside the app with 1-tap installation.
            - **📊 Real-Time Progressive Sync Bar**:
              - Streaming progress bar with live scan percentage, message counter, and detected transaction count.
            - **🛡️ Security Hardened**:
              - Secured SMS broadcast receiver against spoofing and disabled unauthorized ADB backup extraction.

            #### 📲 Download & Install:
            Download **`ArthaTrack-Beta-v1.1.0.apk`** below to install directly on your Android phone!
            *(Application ID: `com.arthatrack.beta` — updates smoothly over previous builds)*
          files: build/app/outputs/flutter-apk/ArthaTrack-Beta-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

